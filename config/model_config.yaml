# A-Insight Pro - Model Configuration V2.0
# Optimized for generalization (less overfitting)

lstm:
  hidden_size_1: 128
  hidden_size_2: 64
  num_layers: 2
  bidirectional: true
  dropout: 0.3
  attention_heads: 4
  seq_len: 60
  pred_horizon: 5
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 100
  early_stopping_patience: 15
  huber_delta: 1.0

random_forest:
  n_estimators: 300         # Keep high tree count for smooth predictions
  max_depth: 12             # Reduced from 20 — prevent overfitting to noise
  min_samples_split: 10     # Increased from 3 — require more evidence to split
  min_samples_leaf: 5       # Increased from 1 — prevent leaf-level overfitting
  max_features: 0.5         # Feature bagging: use 50% features per split
  random_state: 42
  n_jobs: -1

ensemble:
  method: "weighted_average"
  lstm_weight: 0.6
  rf_weight: 0.4

features:
  tech_features:
    enabled: true
  derived_features:
    enabled: true
  market_features:
    enabled: true
  fundamental_features:
    enabled: false          # Future: PE, PB, market_cap, sector

# Feature correlation pruning
feature_selection:
  max_correlation: 0.95     # Remove one from each correlated pair
  min_importance: 0.002     # Drop features with <0.2% importance
  n_walk_forward_folds: 3   # Walk-forward CV folds

# Market regime detection
regime:
  enabled: true
  lookback_days: 60
  volatility_high: 0.03     # Daily vol > 3% = high vol regime
  trend_threshold: 0.05     # 5% over 20 days = trending
