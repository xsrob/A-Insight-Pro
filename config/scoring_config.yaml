# ============================================================
# A-Insight Pro - Scoring Configuration V7.0
# Calibrated for V8.0 ensemble predictions
# ============================================================
weights:
  predict_percent: 0.55      # Increased — prediction is primary signal
  win_rate: 0.12
  avg_return: 0.10
  total_return: 0.10
  max_drawdown: 0.13

levels:
  A_plus: 85
  A: 70
  B: 55

ratings:
  A_plus: "强烈关注"
  A: "重点关注"
  B: "观察"
  C: "回避"

market_adjust:
  min: -8
  max: 5
  default: -3

learning:
  min_penalty: -12
  max_penalty: 8
  overestimate_threshold: -5
  low_success_threshold: 0.3
  penalty_magnitude: -8
  boost_magnitude: 5

risk:
  low_drawdown: -0.05
  medium_drawdown: -0.15

backtest:
  top_k: 20
  initial_capital: 1000000
  rebalance_freq_days: 5
  transaction_cost: 0.00125    # Buy 0.075% + Sell 0.125% = ~0.10% round trip
  slippage: 0.0005
  max_lookback_years: 3
  benchmark: "CSI300"

# Regime-based position sizing (overrides when regime is detected)
regime_positions:
  BULL_TRENDING: 70
  BULL_VOLATILE: 50
  BEAR_TRENDING: 20
  BEAR_VOLATILE: 10
  SIDEWAYS: 40
  CHOPPY: 25
